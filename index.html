<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#020305;--navy:#0b1630;--navy2:#15264d;--steel:#8b93a3;--mist:#d9dce3;--line:rgba(217,220,227,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:var(--mist);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
#glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(520px circle at var(--mx,50%) var(--my,35%),rgba(21,38,77,.75),transparent 70%)}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1}
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem 1.25rem}
.logo-wrap{perspective:900px}
.logo{width:min(78vw,460px);display:block;transition:transform .15s ease-out;filter:drop-shadow(0 0 22px rgba(90,125,210,.35))}
.hero p{margin:1.5rem auto 0;max-width:30ch;color:var(--steel);font-weight:300;font-size:1.15rem;line-height:1.5}
.hint{margin-top:2.5rem;font-size:.85rem;color:var(--steel);letter-spacing:.04em}
.wrap{max-width:640px;margin:0 auto;padding:4rem 1.25rem 3rem}
h2{font-weight:800;font-size:clamp(2rem,7vw,3.2rem);line-height:1.02;margin:0 0 1rem;letter-spacing:-.02em}
.bio{color:var(--steel);font-weight:300;font-size:1.1rem;line-height:1.65;max-width:52ch;margin:0 0 3rem}
.links{display:grid;gap:.75rem}
.link{--x:50%;position:relative;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.35rem 1.4rem;border:1px solid var(--line);border-radius:6px 22px 6px 22px;color:var(--mist);text-decoration:none;overflow:hidden;isolation:isolate;transition:border-color .3s,transform .3s}
.link::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(260px circle at var(--x) 50%,var(--navy2),var(--navy) 70%);opacity:0;transition:opacity .3s}
.link:hover,.link:focus-visible{border-color:#5a7dd2;transform:translateX(6px);outline:none}
.link:hover::before,.link:focus-visible::before{opacity:1}
.link b{display:block;font-weight:500;font-size:1.25rem}
.link small{display:block;color:var(--steel);font-weight:300;margin-top:.2rem}
.link svg{flex:none;width:26px;height:26px;stroke:var(--mist);fill:none;stroke-width:1.2;transition:transform .35s}
.link:hover svg{transform:rotate(45deg) scale(1.1)}
.link.main{padding:1.9rem 1.4rem;background:linear-gradient(120deg,var(--navy),#05070f);border-color:rgba(90,125,210,.5)}
.link.main b{font-size:1.6rem;font-weight:800}
footer{padding:4rem 1.25rem 3rem;text-align:center;color:var(--steel);font-size:.85rem}
footer img{width:120px;opacity:.85;display:block;margin:0 auto 1rem;transition:opacity .3s,transform .6s}
footer img:hover{opacity:1;transform:rotate(-6deg) scale(1.08)}
.intro{animation:in 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;filter:blur(14px);transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){.intro{animation:none}.link,.logo,footer img{transition:none}html{scroll-behavior:auto}}
</style>
</head>

const LINKS=[

/* ================================================== */
const arrow='<svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const box=document.getElementById('links');
LINKS.forEach(l=>{
  const a=document.createElement('a');
  a.className='link'+(l.main?' main':'');a.href=l.u;a.target='_blank';a.rel='noopener';
  a.innerHTML='<span><b>'+l.t+'</b><small>'+l.d+'</small></span>'+arrow;
  a.addEventListener('pointermove',e=>{const r=a.getBoundingClientRect();a.style.setProperty('--x',(e.clientX-r.left)+'px')});
  box.appendChild(a);
});
document.getElementById('yr').textContent=new Date().getFullYear();

const root=document.documentElement,logo=document.getElementById('logo');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let mx=innerWidth/2,my=innerHeight*.35;
function move(x,y){
  mx=x;my=y;
  root.style.setProperty('--mx',x+'px');root.style.setProperty('--my',y+'px');
  if(!reduce){
    const rx=(y/innerHeight-.5)*-18,ry=(x/innerWidth-.5)*22;
    logo.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
  }
}
addEventListener('pointermove',e=>move(e.clientX,e.clientY));
addEventListener('deviceorientation',e=>{if(e.gamma!=null)move(innerWidth/2+e.gamma*8,innerHeight/2+(e.beta-45)*6)});

/* rede de linhas finas, como o traço da assinatura */
const cv=document.getElementById('net'),c=cv.getContext('2d');
let W,H,P=[];
function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);
  const n=Math.round(Math.min(110,W*H/14000));
  P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}));
}
size();addEventListener('resize',size);
function frame(){
  c.clearRect(0,0,W,H);
  for(const p of P){
    const dx=p.x-mx,dy=p.y-my,dd=Math.hypot(dx,dy);
    if(dd<160&&dd>0){p.x+=dx/dd*(160-dd)*.02;p.y+=dy/dd*(160-dd)*.02}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
  }
  for(let i=0;i<P.length;i++){
    for(let j=i+1;j<P.length;j++){
      const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
      if(d<130){
        const near=Math.hypot((P[i].x+P[j].x)/2-mx,(P[i].y+P[j].y)/2-my)<220;
        c.strokeStyle=near?'rgba(120,150,225,'+(1-d/130)*.7+')':'rgba(139,147,163,'+(1-d/130)*.22+')';
        c.lineWidth=near?1:.6;
        c.beginPath();c.moveTo(P[i].x,P[i].y);c.lineTo(P[j].x,P[j].y);c.stroke();
      }
    }
  }
  if(!reduce)requestAnimationFrame(frame);
}
frame();
</script>
